name: Build and Test

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Part2-API/RaceDay.sln

      - name: Build
        run: dotnet build Part2-API/RaceDay.sln --no-restore

      - name: Test
        run: dotnet test Part2-API/RaceDay.sln --no-build --verbosity normal
